name: Update Coffee Atlas Data

on:
  push:
    paths:
      - "Coffee_Atlas_Database_V1.6.xlsx"
      - "scripts/excel_to_json.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel reader
        run: python -m pip install openpyxl==3.1.5

      - name: Convert Excel to atlas.json
        run: python scripts/excel_to_json.py

      - name: Commit generated JSON
        run: |
          if git diff --quiet -- data/atlas.json; then
            echo "atlas.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlas.json
          git commit -m "Auto-update Coffee Atlas data"
          git push
