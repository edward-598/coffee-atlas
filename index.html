<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100e">
  <title>Coffee Atlas V1.5.2</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- =========================
       RESPONSIVE NAVBAR
       ========================= -->
  <header class="navbar">
    <button class="navbar__brand" data-route="home">
      COFFEE ATLAS
    </button>

    <!-- Desktop navigation -->
    <nav class="navbar__desktop" aria-label="主要導覽">
      <button data-route="explore">EXPLORE</button>
      <button data-route="search">SEARCH</button>
      <button data-route="learn">LEARN</button>
      <button data-route="roasters">ROASTERS</button>
    </nav>

    <div class="navbar__actions">
      <button class="navbar__icon" data-route="favorites" aria-label="My Beans">
        ♡
      </button>

      <!-- Only visible below 760px -->
      <button
        id="menuToggle"
        class="navbar__icon navbar__menu-toggle"
        type="button"
        aria-label="開啟選單"
        aria-controls="mobileMenu"
        aria-expanded="false">
        ☰
      </button>
    </div>
  </header>

  <!-- =========================
       MOBILE DRAWER
       ========================= -->
  <div
    id="menuBackdrop"
    class="menu-backdrop"
    aria-hidden="true">
  </div>

  <aside
    id="mobileMenu"
    class="mobile-menu"
    aria-hidden="true">

    <div class="mobile-menu__header">
      <span>COFFEE ATLAS</span>

      <button
        id="menuClose"
        class="navbar__icon"
        type="button"
        aria-label="關閉選單">
        ×
      </button>
    </div>

    <button data-route="explore">
      <b>EXPLORE</b>
      <small>探索世界咖啡產地</small>
    </button>

    <button data-route="search">
      <b>SEARCH</b>
      <small>全域關鍵字搜尋</small>
    </button>

    <button data-route="learn">
      <b>LEARN</b>
      <small>咖啡小知識</small>
    </button>

    <button data-route="roasters">
      <b>ROASTERS</b>
      <small>每月精選 Roaster</small>
    </button>

    <button data-route="favorites">
      <b>♡ MY BEANS</b>
      <small>我的喜愛清單</small>
    </button>
  </aside>

  <main id="app"></main>

  <script src="app.js"></script>
</body>
</html>
